body:
  text: 太一祕諱二太一者道之子也道應物之感現神生一一神接𨗳生成一切無窮無極為學之先先覺習此以成至真真聖相傳以引後學後學後覺順從與先為一與先為一乃與道同三才五德九皇尊靈變化之所起救群品所資此太一三五及九神道之源極也一則總統幽顯為無象之宗二則玄元始交氣為天地人人有利鈍平天地應之為三品離合為五三三合九變化備具錬旡錬有有旡洞逹由乎至人人法地地法天天法道道法自然三才有形堪能行道行道究竟階同自然差次雖五共歸一源故太一之神最尊最貴生天立地成人物也凡不受河圖本源不佩真字不識本源太一不存五神不守三一不事九皇皆不得行大謝大謝請召啓告周遍尊極靈諱內神隱名不經師受慎勿妄修修用宜受受之詣師而因緣得文當依玄盟之儀依玄盟之儀人不可妄作一法強冒行之行之得罪陷已誤人必願奉行當密尋明師及覓玄盟之儀精心潔已自然相遇依科先具啓告表奏既竟設醮獻誠唯謹唯密有違則考臻能勤能篤久順則福至福至積德與道俱存太一尊神諱務猶收字歸會昌一名解明一名寄頻因緣積善遇此真諱密識心存動靜潛呪乞願所求隨心願念不得告人若非其人彼此得罪欲免罪期福默識存之恆見太一尊神光象煒燁異常在已左右或坐或行緩急日夜諦存不忘則凶消吉至久必對言言合形同共為一也不能晝夜恆存者可夕存之在己身六合宫中入兩眉間却入一寸為明堂二寸為洞房洞房南明堂北是六合宫上有太極宫太一晝居太極夜居六合也常能存此功行日新魔不敢犯若不知太一空行功德為邪所破德業旡成矣學者求成存一為急也九皇寶籙三第一陽明星玉皇九晨君天樞星此陽明之魂神也對陽明西北門上真皇夫人第二隂精星玉皇北上晨君天旋星此隂精之魂神也對隂精西門上玄皇夫人第三真人星玉皇主仙華晨君天機星此真人魄精也對真人東南門元皇夫人第四玄冥星玉皇玄上飛蓋晨君天權星此玄冥魄精也對玄冥東門華皇夫人第五丹元星玉皇金魁七晨君玉衡星此丹元魄靈也對丹元東北門中皇夫人第六北極星玉皇北晨飛華君闓陽星此北極魄靈也對北極北門晨華元皇夫人第七天關星玉皇總靈九元北蓋晨君瑶光星此天關魂精大明也天關南門下對北極靈皇夫人第八輔星玉皇帝尊九晨君洞明星此輔星魂精陽明也對輔星西門在天關上帝皇夫人第九弼星玉皇帝真元晨君隱元星此弼星之魄明空靈也對弼星東南門上皇夫人右九皇九夫人應感寄星因光示妙引末歸源萬品多端不離乎九是故次第隂陽相對欲存神佩圖供養禮拜思想見真以求所願可精素半幅令廣一尺長一尺二寸以輕青為本星以輕黑為魂魄皇君夫人服色吐氣依如題注師相傳所佩圖文悉不得題準前號後録書之如法某圖號年太歲某月翔日時某州郡縣鄉里男女官姓名年若干歲字某月日生納音某帝子支屬某嶽某星於某州郡鄉里山林館舍從師男女真人先生姓名受九皇隱諱長生不死之訣九府靈官防衛某身却邪納正同會玉帝之前不得有違如太玄都律令陽明太尉府九百二十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人隂精上宰府五百五十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人真人司命府七百七十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人玄冥遊擊府八百品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人丹元斗君府七百二十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人北極太常府七百七十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人天關上帝府九百品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人輔天尊玉帝府九百品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人弼太帝真卿府九百九十品九億萬諸靈官飛龍騎吏繡衣使者玉童玉女九九億億萬人符並朱書一陽明星天之太尉司正主非上總九天上真中監五嶽飛仙下領後學真人天地神靈功過輕重圍九百二十里有青城玉樓據斗真人姓上靈諱搖天捶九晨玉冠青羽飛裳執斗玄圖坐樓中知內諱者玉晨下映飛行太空二隂精星天之上宰主祿位上總天宿下領萬靈及學仙之人圍五百五十里有五色玉樓舉魁真人號北上神君姓育嬰諱激明光玄精玉冠玄羽飛裳執五色羽節三真人星天之司空主神仙上總九天髙真中監五嶽靈仙下領學道之人圍七百七十里有黃臺玉樓履斗真人號主仙華神君姓歸玭諱處衆踖飛晨寶冠青羽飛裳執斗中青籙四玄冥星天之遊擊主伐逆上總九天鬼神中領北帝三官下監萬兆圍八百里有朱臺玉樓步中斗真人號玄上飛蓋晨君姓冥樞諱搖天柱三華寶晨冠丹錦飛裳執命靈之節五丹元星天之斗君主祿命籍上總九天諸籙中統鬼神簿目下領學真兆真命籍諸天諸地莫不總統圍七百二十里有素臺金樓躡紀真人號金魁七晨君姓上開諱變五道七寶飛天冠白錦飛裙執青玄籙籍六北極星天之太常主升進上總九天上真中統五嶽飛仙下領學者階級圍七百七十里有玄臺玉樓步綱真人號北晨飛華君姓明靈諱昌上元飛精華冠紫錦飛裳執斗玉策七天關星天之上帝主天地機運四時長短否泰劫會圍九百里有九層玉樓乘龍真人號總靈九元北蓋晨君姓玄樞諱開天徒九元冠九色錦裳執暉神之策八輔星天尊玉帝之星日常陽也主飛仙上總九天下領九地五嶽四瀆神仙之官圍九百九十里有紫氣玉樓遊行三命真人號帝尊九晨君姓精常諱空上開正延飛精玉冠九色鳳衣執火鈴九弼星太帝真人星日空隱也主變化無方圍九百九十里有玉臺紫館裴徊三陽真人號帝真元晨君姓幽空諱冥陽暉幽寥飛天玉冠九龍衣執帝章一天樞星元斗宫中魁精玄上真皇夫人姓明通諱嬰育真名飛靈華頽之髻紫黃青三色裙帶九鈴綬口恆吐青氣光注陽明星二天璇星玄魁宫中靈精上玄皇夫人姓玄鏡諱欎勃光真名飛錦羅裙鳳文錦帔帶靈飛紫綬口恆吐黑氣光注隂精星三天機星上精宫中靈妃元皇夫人姓常明諱化雲真名戴晨嬰寶冠飛靈明光錦襡帶六山飛晨綬口恆吐黃氣光注真人星四天權星綱極宫中上靈神妃華皇夫人姓開生諱運明真名七稱玉冠緋羅鳯文襡金真玉光口恆吐赤氣光注玄冥星五玉衡星靈關宫中北上金蓋中皇夫人姓元方諱神武真名紫晨飛華符九色襡帶神虎玉文口恆吐白氣光注丹元星六闓陽星紫極宫中安上晨華元皇夫人姓玉元諱華根真名玉晨進賢冠飛青襡帶流金火鈴口恆吐緑氣光注北極星七瑶光星運天宫中玉華靈皇夫人姓慶元諱終會真名飛華雲頽髻七色夜光雲錦晨九色錦帔帶天威靈玉策口恆吐赤氣光注天關星八洞明星真空宫中太明皇夫人姓幽升諱元韻真名頽髻飛羅雲襡帶九光綬口恆吐青氣光注輔星九隱元星常寶宫中空玄變靈上皇夫人姓冥通諱萬光真名七稱玉冠青文錦裙帶九光夜燭口恆吐黑氣光注弼星一訴彼之非明此之是遏他之惡申巳之善自責而不怨人通理而各祈祐除罪延福告請天之太尉第一玉皇君二隂陽學官干祿求位告請天之上宰第二玉皇君三學道期仙通神逹聖告請天之司空第三玉皇君四制服人鬼惡逆誅伐幽顯凶邪告請天之遊擊第四玉皇君五立功建德益算延年告請天之斗君第五玉皇君六屈滯疾厄乞申希免告請天之太常第六玉皇君七天地否激氣候不調告請天之上帝第七玉皇君八禳却衆災飛上履下告請天之玉帝第八玉皇君九變化無方應救一切告請太帝第九玉皇君右九皇君九夫人內姓隱諱知之延夀七千年常夕夕觀之想見皇君夫人形相威光憶其姓諱諦存心得見第八第九二星延夀無窮九皇九夫人是九氣之魂精九天之魄靈九星之妙象九化之威神男女學道佩帶醮之出入行來坐卧思真憂喜疾厄救疾扶衰修身濟物恆存識之災消禍散厚福通神有急之日竹素依法朱筆書符向北再拜井花水服之起一周九更始一兩三憂除疾愈便可止息無他呪言唯存九諱勤立善功九年不解必獲神通玉皇要旨慎勿妄宣密而修之位為真人元君交逰上聖三清元始真人受之裂素立圖啓告而傳祕諱心存則成仙也凡受河圖先請九皇內諱對齋九日七日三日一日隨時施行投辭啓告三日限竟山館壇堂唯清間靜乃奏表如左太上某洞法師某嶽先生九宫真人臣某等稽首再拜上言太上無極大道無上無為至真天尊髙上萬真玉晨道君扶枽大帝暘谷神王諸天帝皇後聖九玄帝君金闕玉陛下上相青童太極真人玄中大法師三界內外一切明靈臣無始之劫輪轉善緣得以凡庸叨聞妙法參受祕要銘荷唯深良因幸會逰涉諸方某年某月某日某時於某州郡縣鄉里中從男女師名受河圖寶文上清隱諱佩帶修行蒙見今日法禁嚴密不得妄傳復索種人又不得閉今有某州郡縣鄉里或今居某男女道士姓名於某州郡縣鄉里山林館投辭求受至誠慊欵足充賢明但臣以寓蔽神智未通知人常難實敢保祕謹依科法清嚴傳真啓告靈祕委玄監察伏願太上大道無極天尊遍勒三界一切神明降應感之靈獎建善之志付授之後改往修來神真擁護邪魔敢干良人相遇凶醜歸降使情開意悟動靜合真某弟子名也約當專心𨑰源不敢隨逐流沫苦行遵承首捨衆舋拯拔眷屬造立新功誓不謀圖榮欲姦宄肆心當杜塞劫賊之緣防遏恣縱之路不殺不淫不妄不竊不驕不暴守一存三行五體七備九寶十精遣嫉妬之垢洗隂𩁿之塵不抑絶賢良不背伐師道不罵辱一切泄露要言不冒戶哀慟不協女叨真不酣歌亂正不嗊嗃欺人不鬼黠輕物不恃髙凌卑不盜略經書不改易圖誥不棄毀聖文不自作一法不迷惑忘歸不疑誤萬姓先有斯罪悉乞原除自今巳後不敢又犯仰希髙聖大神玉晨大帝玄中法師同垂鑒映勑十方善神三界官屬隨順緣次防護降矜大慈含弘善成善貸蕩濁以清濟愚以智保使危者獲安斷者更續令某才識英拔免度衆災夀命延長與真合德億曾萬祖超升福堂表裏親踈一切同泰行化立功觸地無礙智照畢周常存無極子孫繁昌智惠殊特天爵人位長久安全道業廣被幽顯荷恩蒙如所請銘鏤玄慈干瀆罔極觸忤威靈俯仰慚惶進退忓憟憑怙與善之澤荑榮巳枯之姿方勤潔巳之威敬俟妙門之應罄瀝丹志恭驗神效臣與某或等同瀹身心俱期至極不負所陳恩惟太上至真天尊髙上萬真玉晨道君分别垂哀臣愚謹因九皇靈官飛龍騎吏繡衣使者操臣為男女道士姓名拜授河圖寶文上清隱諱朱表一通上詣無上三天九皇玉帝三元曹伏須告報臣某誠惶誠恐頓首頓首再拜以聞臣姓某屬某州郡縣今屬某州郡縣太上無極大道無上無為至真天尊髙上萬真玉晨道君扶桑大帝暘谷神王諸天帝皇後聖九玄帝君金闕玉陛下太歲某月某日時於某州郡縣鄉里山林館凡表體以黃素長一尺廣二尺四五寸計事狀取容人多加之前空一行次行作太字在分上次上字在分下下以次計一寸三字朱分書闌頭各出五分以朱郭周闌中九寸二十七字為則前再拜下長短悉空之次行去上一字作言下空之次行歷分書空上行極分闌內勿差降也後以闌後空三行題臣某姓名後三行記太歲姓中央一行細書太上至陛下四十五字三分題記上三寸書太上三寸空之下三寸後行題太歲後分減三行其中言太上尊位皆懸一字若逼行下三寸以還皆上行三寸以外懸書如法自名勿露重名勿分勿令尊位極下下有餘字乃為通耳若拜下以聞有餘長短悉空之勿拭汰勿佳毚誤得洗治三字之外並都易去依淨經法更新潔分明書也讀表畢乃筆鎮上操復如法唯未復爐仍讀籙前鞠令次受後諸官每一官師云度弟子伏稱名受受竟起再拜亦可九拜畢拜伏師呪勑諱符曰玉皇九君夫人九神却邪輔正錬偽成真憂病廓散功業日新保某得道長為上賔畢卷授與弟子男左手女右手取統腰後度三過插懷中又拜九叩搏都畢師起上香復爐出出後設醮亦可前後擇王相之辰依按如左上清河圖內玄經卷上
