body:
  text: 香燈謝文四安九燈七燈然油二燈然香普列北方某燈南施一席設九槃棗九片脯安棗上九處𪉩著槃後九柸酒置槃前某又別施一席向燈安香桉某長跪九上香仍臨目存見九星神在天上畢叩齒九通起某稱三寶弟子臣姓名今謹奉請輔星帝席宫紫氣玉樓帝尊九晨皇君皇夫人髙皇左夫人弼星上尊宫玉樓紫館帝真元晨皇君皇夫人髙皇右夫人貪狼子生陽明太上宫青城玉樓九晨皇君皇夫人逃元內妃巨門丑亥隂精中元宫五色玉樓北晨皇君皇夫人化形內嬪祿存寅戍真人真元宫黃臺玉樓主仙華晨皇君皇夫人上元母文曲卯酉玄冥紐幽宫朱臺玉樓玄上飛蓋晨皇君皇夫人中元內妃廉貞辰申丹元岡神宫素臺金玉樓金魁七晨皇君皇夫人斗中大女武曲巳未北極紀明宫玄臺玉樓北辰飛華皇君皇夫人斗中中女破軍午生天關關㑹宫九層玉樓總靈九元北蓋皇君皇夫人斗中少女謹請七靈大神九精帝晨回尊紆鑒垂愍至心賜降雲駕動聖光儀與中和君萬福君延夀君好生君明算君保録君定命君賞善君應願君從神童玉女直符直事真官正神將軍騎吏一切官屬俱降此某里中露壇墠之上察某翹仰之情歆某貧微之禮臣某與某道義相延終始有因情同骨血齊心投地某歸命九皇髙尊七聖大靈大道至真諸君丈人臣某誠惶誠恐稽首再拜更上酒酌柸令得三拈三上酒合得九拈成九獻禮畢稱三寶弟子臣某上啓七靈大神九精帝晨明靈髙尊道德諸君一切正神某今謹有同義某州郡縣鄉里姓名即日操墨辭謹讀如列某伏願一切神明鑒映辭言并某今設微禮謹操本命繒綵如干尺某詣所屬苐如干皇君夫人隨人命所屬次茅玉機前乞拔贖某應絶之命請更造之恩伏願某皇君夫人咸共哀某丹心饗某今設此微禮共垂證盟仰希衆靈囑勸所屬某皇君夫人特賜以慈恩降以應感使某永免厄疾無復死病之憂得脫於非橫之禍衆灾消弭所向諧心觸願如志丹誠慊疑因臣以聞臣以愚庸謬參真教志揚玄風救護一切先人後己不敢有懈今不勝䖍心勤欵謹為冒昧上陳但人生運動實自多𠎝良由愚暗任用乖真致使迷塗失正伏尋理在有境不得無心心之所務唯當去暗就明明須瑩發由乎聖神玄獎既應聖許祀謝神許開矜開矜由於誠欵祀謝關於洗心心盡則應首悔無量之罪誠欵則宜敬獻祭饌之儀儀整則神祐必至罪釋則善願必諧仰緣斯理敢布丹心夫郊天祀地望祭山川前聖垂之於外謨後睿尊之以成德至於請五老而祈太一招八靈而致六神玄真既著之於內科明詰繼之以弘道品位有序妙在無邪是以奉修稱意隨時進獻貴不厭豐賤不拘儉故碧帛驎鳳玉醴瓊漿乃髙通者之所辦非卑窘者之所參若乃鴻鷺之羞上帝蘋藻之薦尊神威嚴非微臣之所宜行愚欵之所表至某今刷貧依法供辦酒脯𪉩豉等味然燈照曜以秉發皇靈燒香騰啓以仰期感應是以濯浣身神投命玄極竭其歸仰之丹心不願輕微之菲陋伏願明靈大聖至真尊神特賜愍佑副其翹勤臣恐譴重功微方罹殃考性命難保子孫難得所向乖心今仰憑玄真善成無弃謹自整潔洗濯身心為某首捨衆釁某從無始世界以來經劫無數或為男女人至于今生轉輪未息或嘗運性鄙蔽立志猖狂不信大道不敬神明為子不孝為父不慈為君不道為臣不忠為兄不友為弟不和為長不慎為幼不恭為師主不敬為弟子不謹為朋儔不義為賔友不誠為姑不篤為婦不䖍為母不愛為姨不敦為舅氏不穆為伯叔不仁為娣姒不順為妾媵不謙為夫妻不睦為嫡庶不平為內不靜為外不明為上不軌為下不清為賤不遜為貴不廉為男不潔為女不貞不逹義方不了妙趣芒昧玄宗留連世務塵路思著俗海忘超五情六欲觸蕩精神三毒七積撓亂心志業行不專取捨非一進退無恆異端盈臆道風既𧇊世範又缺身與年衰釁隨日結動不顧利靜不修戒深福大善永不議作巨禍洪惡日夜競為或有急之日暫存道小寬之辰輒忘真返逆無狀縱橫肆心或憑威乘勢恃寵強梁或毀道敗德殺害君親破壞經圖攻伐師尊誅傷同氣殺戮友朋酷虐萬類輕誷百靈或發泄冢墓開他棺槨刑尸罰鬼驚骸動神欺滅儕黨痛感天人或斬斫神主焚燒社廟隂懷謀逆陽論順命嫉妬勝己讒謗忠貞縱逞楚毒抑絶賢明捐交弃好苦克邦鄉譛善長惡訕誚才良慳貪益己不願施人割奪四輩唯潤一身食啖百姓受取萬端得無厭足侵略人神或藉貴怙富凌賤孤貧或略人所愛離隔六親分絶骨肉斷遏四鄰或蒸通九屬淫犯萬殊恣溢失度諂忌無拘强相呪咀妄加善人呌喚罵詈牽引鬼神指斥日月告訴星辰或勸人作惡不教童蒙暗任縱橫觀人成敗或好色耽酒麗飾自玩胸心顛倒粗惡險暴歌哭無常舉止不覺掊擊東西翻覆南北或手肆𠒋逆或俠他行虐或妄觸人神叨忤清淨慠突明靈評論經教誹誚正法違負信約欺誘矯詐妖媚諛佞或嗔恚忿恨殘剋自髙嗊嗃并勢貪婪日結或戲謔勝負罔薎尫微誑惑朝野嘲調閨幃或外僞剛直內懷曲刃干知是非以退為進強占星宿卜相自衒妄期禍福表裏無信面譽背毀巧言令色誤脫家邦破亂宗國或不敬明德不納忠言隂嫉髙勝潜害英能或假託神鬼詐稱天靈𥨸豫妄言妖惑百姓扇動天地駭怛神明或斷截人路逼迮母子閉塞人善良抑絶人休美或積藥思人病蓄棺願老死訾人學方自譽巳業虛造生空妄作一法不逹權化謬懷疑二或因公行𥝠迷誤後世好樂臰腥忌要芳淨或馳騁田獵呵罵風雨姦盜劫賊剌射天地隂罪隂過陽罪陽過死罪死過幽顯遍知反理違經犯律破戒上負三光四時五行下忤萬象九宫六甲中觸里域神祇冡宅精靈先亡魂爽井竈門庭出入户路履歷莊衢經涉失祀所在違和處處犯禁種種成𠎝或知而故為或謬誤不覺或被迫從人或身心自搆或忍而無悔或悔而未謝或謝而又犯未能長革或久謪釁深未能永悛或日積月深無限無量不可具陳或中表相牽內外相染男女大小一切眷屬後世今生俱有罪過更相延誤或同謀共作或尊上使為或懸相要擬傍生罪根因緣在彼自不覺知或操概不堅被試不過神鬼遘怨師徒連禍先仇宿對方未解釋從脕結咎稍復滋繁或嘗為奴婢役使胡夷蠻貊戎狄氐羌魚鳥蟲獸魔邪精魅窮粗極醜更相食噉讎報未終所陳條目略而未盡回環歷劫不可憶知犯與不犯不自分别各在兩宫七十四部事簡三元百二十曹結咎既深考在不測將慮一旦奄同塵壤小事云處世規圖懼不如心某今投命九皇大聖尊神仰憑至德特氣降祐賜垂慈恩令五嶽使者即須下所由隨源料理罪文咎結一切解除以宥基謫斷絶惡根積釁纍𠎝悉蒙洗蕩輔𨗳信心開通善路正氣流滋貴神保護某巳往之釁都洗即今之𠎝悉除當來之尤不生從善之志日進上學之願無退修經習戒以今為始三界五帝六甲九宫玄洲靈洞主土真官無量仙聖一切善神賜納臣言同記今請矜某首洗之丹心愍某自新之慊志採臣勸善之誓言副臣歸仰之丹誠令都天監司過君延生之局增福之司咸共削某黑簿注名青文令衆灾度脫夀命延長長保福慶合門興隆凶妖消散善願咸從夢想真正冡宅安寧止殃滅注內外同休以顯玄神明信之驗以酬某元元之心隨意續言每在省約某又一上酒畢各三過止臣某重啓九皇尊神七聖明靈一切正神臣以芻陋生長流俗不間妙法恐所施失儀言辭叨餮觸忤威靈進止違典舉事𠎝深懼不能相濟還嬰咎責特願明靈曲垂照愍哀矜不及獎成善心不加譴罰宿釁蒙原臣所願皆得諧心欲有願樂隨意言之某荷恩之日並依科重獻誠禮一如今夕某伏願明靈大神一切真官同垂慈恩共賜開導與善相因神靈獎恱所啓所願即蒙御聞今夜所請必遂如心則仰荷明神更造之恩今乞洪澤浹潤某身請以餘杯賜某飲進令神氣降洽善願克諧取此人命所屬酒一杯與飲之臣上啓九皇大神明靈髙尊道德諸君一切善神向有某甲為某事云臣與道義因緣冒昧干請仰屈威靈臨鑒已久不敢稽淹神駕願各還本宫安神復御垂神流恩以景福祚延長約勑所在土地真官宅舍善吏堂宇僚局明各榮衛某身及臣使積罪永除福名更始令所請如啓所願必遂不孤至向須後有請仰希重降臣某誠惶誠恐稽首再拜送神依次拜送拜送神亦可都再拜而巳仍伏叩頭乞升車之恩必副元元之情欲有所言隨人意密道畢起復爐若度事後即醮未可復爐仍設醮醮竟復爐也醮畢取第一杯酒少許灌地不必令盡若欲以治病病人所屬星杯可取與飲之無病厄者悉出外賦作禮敬進之勿及異人疑怪彼此得罪其所識悉篤信無嫌者皆得分之若度事之後别時設醮或自為為人乞願請恩並存神竟扣齒發爐若入壇堂漱呪如法凡學士功輕未能得道傳授靈文更相開度建德立功良時吉日祈請玄恩同先謝過生由九氣成由九天學由九業品極九階仙真及聖各有經法習之未周不能免咎有所云為皆悔罪為端然後恩祐不求自至求福以著入微故先陽明至輔弼除罪以微至著故先輔弼以至陽明謝文貴賦前辭消息受事請恩依源𢌜詔唯首謝正同迎送不異危急修之可略謝耳觀星要法凡受九皇諱後良夜請天𢘆諦觀北斗存識次苐內外姓名思見神降與巳語言次覓輔弼令得見形精心注仰久自覩之觀星唯密勿令他知或有問者餘言答之不得泄露通其所視見與不見皆莫出言心之與眼相知而巳觀星之時洗淨身氣垢則沐浴穢則易衣衣服芬馨內外淨潔燒香所止存啓玄靈熟看經圖分明憶識然後出視勿匆遑髙言又勿多人同志可三耳同志才非亦勿與共各處為之勿相訪問有事勞倦醉飽交接調和未平皆勿仰觀又醮祭謝過禮拜乞恩積久無徵由於不觀觀雖未見誠至心感稍稍勤之永不懈退必獲了然見則神降醮禮即驗兼濟無窮不能精心習學仰觀魔來壞人凶怪相動醮禮空費勞而罪臻有志之人明相警戒九星所攝各有分野占候吉凶往來出入住止求須營理道俗皆當精察以定所宜可否去就回敗為成尋賢得賢訪聖得聖所作利貞長保元吉矣事九皇王君晝夜行卧坐息飲食交接云為𢘆思見之俯仰屈伸念念不忘九年神降受長生之訣也天中心號北辰有五星第一大星名天樞為母第二天子第三太子第四次子第五名北極天一所生太一所居止在紫宫紫宫東八星西七星列為藩臣中央紫微宫太一常舍為五官二十八宿金木水火土屬五星五星五屬北斗屬太一太一為極位居最尊北斗九星宿衛太一占其吉凶善惡訣如左北極空洞正天之中北極在此空之南此空之在北極之北故曰北辰衆星共之第一為魁頭名天樞天一名正星字貪狼位御史中丞為天為日主陽德天子象以壁室奎婁為徐州主五子歲星第二地璇一名法星字巨門位大司馬為地為月主隂刑女主象以胃昴畢觜為梁州後分為益州主五亥太皇星第三人璣一名命星字祿存位少府為人道主禍以參井鬼柳為冀州主五戍熒惑星第四物權一名伐星字文曲位司徒光祿為四時主伐無道以七星張翼軫為荆州主五卯辰星第五玉衡一名殺星字廉貞位大鴻臚為殺有罪以角亢氏房為兖州主五辰鎮星第六闓陽一名危星字武曲位𢌜尉為食榖以心尾箕為揚州主五色歲星第七瑶光一名部星字破軍位執金吾為兵以斗牛女虛危為豫州主五午白星第八為外輔在北斗第六星下相去一寸許第九為內輔一星在北斗第三星上不可得見見之長成神聖也占八星審同里其位有灾其境有害皆宜避之小則厭禳修功德立禮醮來恩密而勿言禍消福集矣功德者萬善也萬行萬名大要唯九一者不殺二者不淫三者不妄四者不盜五者不邪六者不恚七者不嫉八者不慢九者不滯此為九德得道者也一者放生救死二者賞貞勸潔三者獻忠效信四者布施除貪五者節酒守正六者和釋諌諍七者禁姦止妬八者敬愛尊卑九者通憂解患此為九功公無私也功行乎外德定乎內內立外修神必密降子髙才勤行閉口自驗心傳同志非人勿泄觀見異同心疏億之此方前後驗否可知無功行者見之不明或為邪精化亂其眼見似而非言凶反吉吉更成凶與書乖越冝省過內首然後復觀也一太上宫中帝君變隱逃元內妃姓延明諱太一法坦字幸正扶真名衣黃錦帔丹青飛裙頽雲髻後八髻同二中元宫中帝君保胎化形內嬪姓開關諱太一三來瓫字羅朱嬰真名衣青錦帔緑羽飛裙三真元宫中帝君六遁七隱上元聖母姓溟濛諱太一靈夷字沖𩀱兆真名衣青錦帔繡羽華裙四紐幽宫中帝君匿景藏光中元內妃姓開耀諱太一七烈字橫單盤真名衣紫錦帔黃華羽裙五綱神宫中帝君變體易景斗中大女姓玄路諱太一鬱書字疇丘蘭真名衣朱錦帔紫青飛裙六紀明宫中帝君隱迹散景斗中中女姓棐廉諱太一氣精字抱定陵真名衣朱錦帔青繡飛裙七關㑹宫中帝君分景萬形斗中少女姓翁重諱太一郁默字天凡婌真名衣丹錦帔青華羽裙八帝席宫中帝君化日月水火斗中髙皇左夫人姓常明諱太一石啓珠字絡茂華真名衣紫錦帔繡羽飛丹裙九上尊宫中帝君化金石山河斗中髙皇右夫人姓空黃諱太一愛修字雲育玄真名衣緑錦帔翠羽華裙右九帝君九星斗中宫隱妃九陰名字若祝說之時但說位號名字耳勿道著衣帔及頭結下也子能知帝君九陰者升晨上天位為上清真人兆在世終身不受哭巳灾殃太隂之神衛從萬靈之精拜謁分形散變混合天地此太陰九妃者乃帝君之陰宫神也兆行道解結奉符上籍安魂制魄化生體神道氣延精以求長生而不知帝妃之名字行九陰以混合者亦萬不得仙也兩眉間却入一寸為明堂明堂正方一寸帝君太隂九妃常居其中𢘆以月之偶日齊用生氣時燒香入别室坐卧任意暝目良久存帝君安坐在太極紫房中又存太一五神在六合中又存北斗九星在心中又存太隂九妃在明堂中又存太微童子干景精對立帝君前童子左手把五符右手把五籍又存兆之形立童子後又存太隂九妃從明堂中上入太極紫房中以次橫列立兆後又存太一五神從六合中上入太極紫房中以次橫列立太隂九妃後都畢於是帝君衆神倏歘一合大變共為一人一人如嬰兒始生之狀名曰無常童子字變化左手把九星頭戴日口御月童子以日月九星之光映燻兆一身內外洞徹自覺兆一身通赤如火之炎無復表裏表裏皆炯炯然也此為帝君太一九隂混合變化萬形也良久畢叩齒二十四通咽液九過乃微祝曰洞天神光回曜紫清玄隂九晨隱淪絶冥斗中夫人三女散形神妃內化萬物立成電光雷激雲霧流鈴九變十化生丹起青太一九女合化混停無常縱遁淪虛館冥錦帔華袂紫羽飛裙左佩隱符右帶虎文御火戴斗乎把絶幡傍麾八風四掣景雲逍遙天綱化蕩七元蔽伏山河巔回五辰日月塞暉列宿失真分形作百化軀入千在火為火入林為林居水為水入山為山所求忽至所召已前倐歘適心盻目立臻千種萬物隨心所言帝君在形太上玉晨無英同景四文白元永生天地保養我身口有所道隨意化遷玉童奉侍玉華執巾神妃獻香四真同軒事事物物皆如我言上清河圖內玄經
