front:
  text: 上清河圖內玄經卷上明二玄師聖匠代代相傳感至斯盛光歇兹泯徃返善惡一廢一興沈而更舉絶而重聮悠悠驕慢永隔良因專專謹宻増長善縁縁善能感玄應重臻臻則有異異則通神神師靈典祕字要文自然降見蕩垢消塵嘿識遵奉長生神仙濟身救物三乘互陳幽顯無棄不順自淪淪苦可痛各宜畏旃慎終如始乃合道焉凡自然真文皆空中本有是以或飛或沈或𨼆或顯龍馬龜魚所負圖象皆生無始隨感現出出現參差唯善是與得之者在後其文乆在前今之所得得與者同悉金玉簡扎鏤寫祕藏諳憶究解存誦修行亦以縑素朱書佩身備有遺忘急則尋詳行之消灾却禍延福乆習不怠登聖真仙師資齋潔啓玄告靈非人勿傳妄泄殃深明各加慎宻而遵承也
  hash: sha256:5f11188333ac77eba88687e4addc8685ace2c00e5e53595513fa3e2ae8c00042
